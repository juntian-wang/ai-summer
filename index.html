<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI CAN BB - AI奇葩说</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');

:root {
  --yellow: #FFD600;
  --red: #FF3B30;
  --blue: #007AFF;
  --teal: #00C7B7;
  --dark: #1a1a1a;
  --cream: #FFF8E1;
  --pro: #007AFF;
  --con: #FF3B30;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--yellow);
  min-height: 100vh;
  overflow-x: hidden;
}

/* 砖墙背景 */
.brick-wall {
  background-image:
    linear-gradient(335deg, rgba(0,0,0,0.08) 23px, transparent 23px),
    linear-gradient(155deg, rgba(0,0,0,0.08) 23px, transparent 23px),
    linear-gradient(335deg, rgba(0,0,0,0.08) 23px, transparent 23px),
    linear-gradient(155deg, rgba(0,0,0,0.08) 23px, transparent 23px);
  background-size: 58px 58px;
  background-color: var(--yellow);
}

/* 装饰齿轮 */
.gear {
  position: fixed;
  font-size: 40px;
  opacity: 0.12;
  pointer-events: none;
  z-index: 0;
  animation: spin 20s linear infinite;
}
.gear:nth-child(1) { top: 10px; left: 10px; }
.gear:nth-child(2) { top: 60px; right: 20px; animation-duration: 25s; animation-direction: reverse; }
.gear:nth-child(3) { bottom: 40px; left: 30px; animation-duration: 30s; }
.gear:nth-child(4) { bottom: 100px; right: 10px; animation-duration: 18s; animation-direction: reverse; }

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ===== 标题 ===== */
.header {
  position: relative; z-index: 10;
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
}
.logo {
  font-size: 48px; font-weight: 900; color: var(--red);
  text-shadow:
    3px 3px 0 var(--dark), -1px -1px 0 var(--dark),
    1px -1px 0 var(--dark), -1px 1px 0 var(--dark),
    4px 4px 0 rgba(0,0,0,0.2);
  letter-spacing: -2px; line-height: 1;
}
.logo-reg { font-size: 14px; vertical-align: super; color: var(--dark); text-shadow: none; }
.tag-ai-summer {
  background: var(--teal); color: white; font-weight: 900; font-size: 18px;
  padding: 6px 18px; border: 3px solid var(--dark); box-shadow: 4px 4px 0 var(--dark);
  transform: rotate(-2deg);
}
.ctrl-bar {
  background: var(--dark); color: white; padding: 8px 16px;
  display: none; align-items: center; gap: 12px; flex-wrap: wrap;
  border: 3px solid var(--dark); box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
  position: relative; z-index: 10; margin: 0 20px;
}
.ctrl-bar.show { display: flex; }
.ctrl-btn {
  background: var(--cream); color: var(--dark); font-weight: 900; font-size: 13px;
  padding: 6px 16px; border: 3px solid var(--dark); cursor: pointer;
  box-shadow: 3px 3px 0 var(--dark); transition: all 0.1s;
}
.ctrl-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--dark); }
.ctrl-btn:active { transform: translate(3px,3px); box-shadow: none; }
.ctrl-btn.show { display: inline-flex; }

/* 状态栏 */
.status-bar {
  background: var(--dark); color: var(--yellow); text-align: center;
  font-weight: 900; font-size: 13px; padding: 8px; display: none;
  border: 3px solid var(--dark); box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
  position: relative; z-index: 5;
}
.status-bar.show { display: block; }
.status-bar.paused { color: #999; }
.ctrl-progress { color: rgba(255,255,255,0.6); font-size: 12px; font-weight: 700; }
.ctrl-mode {
  font-size: 11px; font-weight: 900; padding: 3px 10px;
  border: 2px solid currentColor; border-radius: 3px; margin-left: auto;
}

/* ===== 卡片通用 ===== */
.card {
  background: var(--cream);
  border: 4px solid var(--dark);
  box-shadow: 6px 6px 0 var(--dark);
  border-radius: 4px;
  position: relative; z-index: 5;
}
.card-header {
  background: var(--dark); color: white; font-weight: 900;
  padding: 6px 16px; font-size: 14px; letter-spacing: 2px; text-align: center;
}

/* ===== 配置面板 ===== */
.config-section { margin: 0 20px 16px; padding: 20px; }
.config-section.hidden { display: none; }

.topic-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.topic-row select, .topic-row input {
  flex: 1; min-width: 180px; padding: 10px 14px;
  border: 3px solid var(--dark); font-size: 15px; font-weight: 700;
  background: white; outline: none;
}
.topic-row input::placeholder { color: #999; }

.teams-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;
}
@media (max-width:768px) { .teams-row { grid-template-columns: 1fr; } }
.team-box { border: 4px solid var(--dark); background: white; box-shadow: 4px 4px 0 var(--dark); }
.team-header { font-weight: 900; font-size: 18px; padding: 8px; text-align: center; color: white; border-bottom: 4px solid var(--dark); }
.team-pro .team-header { background: var(--teal); }
.team-con .team-header { background: var(--red); }
.team-opts { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.team-opts select {
  width: 100%; padding: 8px 10px; border: 3px solid var(--dark);
  font-weight: 700; font-size: 13px; background: #f8f8f8; outline: none;
}
.team-opts label { font-size: 11px; font-weight: 900; color: #666; letter-spacing: 1px; }

.host-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
.host-group { display: flex; flex-direction: column; gap: 4px; }
.host-group label { font-size: 11px; font-weight: 900; color: var(--dark); letter-spacing: 1px; }
.host-group select {
  padding: 8px 12px; border: 3px solid var(--dark); font-weight: 700;
  background: white; min-width: 140px; font-size: 13px;
}
.mentor-fixed-list {
  display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0;
}
.mentor-fixed-list span {
  background: var(--dark); color: white; font-weight: 900; font-size: 12px;
  padding: 4px 10px; border: 2px solid var(--dark);
}

.start-btn {
  flex: 1; min-width: 200px;
  background: var(--red); color: white;
  font-size: 24px; font-weight: 900; padding: 14px;
  border: 4px solid var(--dark); box-shadow: 6px 6px 0 var(--dark);
  cursor: pointer; transition: all 0.1s;
  letter-spacing: 2px;
}
.start-btn:hover { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 var(--dark); }
.start-btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--dark); }
.start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--dark); }

/* ===== 主舞台 ===== */
.stage-layout {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 14px;
  padding: 0 20px 20px;
  position: relative; z-index: 5;
}
.stage-layout.hidden { display: none; }

.main-stage { flex: 1; min-width: 0; }
.sidebar { flex: 0 0 280px; display: flex; flex-direction: column; gap: 10px; }

.topic-banner {
  background: var(--dark); color: white; text-align: center; padding: 12px;
  font-weight: 900; font-size: 16px;
  border: 4px solid var(--dark); box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
  position: relative; z-index: 5;
}

.speech-box {
  background: var(--cream);
  border: 4px solid var(--dark);
  box-shadow: 6px 6px 0 var(--dark);
  padding: 16px;
  height: calc(100vh - 240px);
  min-height: 350px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
}
.speech-box::-webkit-scrollbar { width: 10px; }
.speech-box::-webkit-scrollbar-track { background: #f0f0f0; }
.speech-box::-webkit-scrollbar-thumb { background: var(--dark); }

/* 发言样式 */
.speech-moderator { text-align: center; font-style: italic; color: #666; font-weight: 700; padding: 6px; }

.speech-bubble {
  max-width: 85%; padding: 10px 14px;
  border: 3px solid var(--dark); position: relative;
  font-size: 15px; line-height: 1.6; font-weight: 700;
}
.speech-bubble::before {
  content: ''; position: absolute;
  width: 0; height: 0; border: 10px solid transparent;
}
.bubble-pro { align-self: flex-start; background: #E3F2FD; border-color: var(--blue); color: #0D47A1; }
.bubble-pro::before { left: -18px; top: 12px; border-right-color: var(--blue); }
.bubble-con { align-self: flex-end; background: #FFEBEE; border-color: var(--red); color: #B71C1C; }
.bubble-con::before { right: -18px; top: 12px; border-left-color: var(--red); }
.bubble-speaker { font-size: 12px; font-weight: 900; margin-bottom: 3px; opacity: 0.7; display: flex; align-items: center; gap: 6px; }

/* 开杠 */
.cross-exam-box {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  border: 4px solid var(--dark); background: #FFE0B2;
  padding: 12px; position: relative;
}
.cross-exam-box::before {
  content: '⚡ KAI GANG ⚡';
  position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
  background: var(--dark); color: var(--yellow); font-weight: 900; font-size: 11px;
  padding: 3px 14px; border: 2px solid var(--yellow); white-space: nowrap;
}
.cross-exam-box.p1-battle::before {
  content: '⚡ 一辩开杠 ⚡';
  position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
  background: var(--dark); color: var(--yellow); font-weight: 900; font-size: 11px;
  padding: 3px 14px; border: 2px solid var(--yellow); white-space: nowrap;
}
.cross-exam-box.p3-battle::before {
  content: '⚡ 三辩开杠 ⚡';
  position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
  background: var(--dark); color: var(--yellow); font-weight: 900; font-size: 11px;
  padding: 3px 14px; border: 2px solid var(--yellow); white-space: nowrap;
}
.cross-col { border: 3px solid var(--dark); padding: 10px; background: white; font-weight: 700; font-size: 14px; min-height: 70px; }
.cross-col.pro { background: #E3F2FD; border-color: var(--blue); }
.cross-col.con { background: #FFEBEE; border-color: var(--red); }
.cross-label { font-size: 10px; font-weight: 900; margin-bottom: 4px; letter-spacing: 1px; }
.cross-strategy-tag {
  display: inline-block;
  font-size: 10px; font-weight: 900;
  padding: 1px 6px; border-radius: 3px;
  margin-left: 4px;
  background: var(--yellow); color: var(--dark);
}

/* 投票 */
.vote-bar-box {
  border: 4px solid var(--dark); background: white;
  box-shadow: 4px 4px 0 var(--dark); padding: 10px 14px;
}
.vote-title { font-weight: 900; font-size: 13px; text-align: center; margin-bottom: 6px; }
.vote-track { height: 30px; border: 3px solid var(--dark); display: flex; overflow: hidden; background: #eee; }
.vote-fill-pro { background: var(--blue); transition: width 0.8s cubic-bezier(0.4,0,0.2,1); display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 13px; }
.vote-fill-con { background: var(--red); transition: width 0.8s cubic-bezier(0.4,0,0.2,1); display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 13px; }
.vote-swing { display: flex; justify-content: space-between; font-weight: 900; font-size: 13px; margin-top: 4px; color: var(--dark); }

/* 导师插话卡片 */
.mentor-comment-box {
  border: 4px solid var(--dark); background: #FFF3E0;
  box-shadow: 4px 4px 0 var(--dark); padding: 10px 14px;
  margin: 6px 0;
  animation: fadeIn .3s ease;
}
.mentor-comment-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 4px;
}
.mentor-comment-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid var(--dark); background: var(--teal);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.mentor-comment-name {
  font-weight: 900; font-size: 13px; color: var(--dark);
}
.mentor-comment-tag {
  font-size: 10px; font-weight: 900;
  background: var(--dark); color: var(--yellow);
  padding: 1px 8px; border-radius: 2px;
  margin-left: auto;
}
.mentor-comment-text {
  font-size: 14px; color: #444; font-weight: 700;
  line-height: 1.5; padding-left: 40px;
}

/* 导师正式点评 */
.mentor-box { border: 4px solid var(--dark); background: #FFF3E0; box-shadow: 4px 4px 0 var(--dark); padding: 14px; }
.mentor-box.hidden { display: none; }
.mentor-card { display: flex; align-items: center; gap: 10px; background: white; border: 3px solid var(--dark); padding: 10px 14px; }
.mentor-avatar { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--dark); background: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.mentor-name { font-weight: 900; font-size: 14px; margin-bottom: 2px; }
.mentor-text { font-size: 13px; color: #444; font-weight: 700; }

/* 投票框 */
.vote-box {
  margin: 8px 0; background: white;
  border: 4px solid var(--dark); box-shadow: 4px 4px 0 var(--dark);
  padding: 12px 16px;
}
.vote-box .vote-title { font-weight: 900; font-size: 13px; text-align: center; margin-bottom: 8px; color: var(--dark); }

/* 跑票卡片 (已在上方定义) */
.sway-card {
  background: white; border-left: 4px solid var(--yellow);
  border-top: 3px solid var(--dark); border-right: 3px solid var(--dark);
  border-bottom: 3px solid var(--dark);
  padding: 8px 12px; margin: 6px 0; font-size: 13px; line-height: 1.5;
  font-weight: 700; animation: fadeIn .3s ease;
}
.sway-card .s-label { color: var(--dark); font-weight: 900; }
.sway-card .s-dir { color: #666; font-size: 12px; }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--dark); color: white; padding: 10px 24px;
  font-size: 14px; font-weight: 900;
  border: 3px solid var(--yellow); box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
  opacity: 0; transition: opacity .3s, transform .3s; z-index: 100; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 投票条形图在舞台区 */
.vote-swing { display: flex; justify-content: space-between; font-weight: 900; font-size: 13px; margin-top: 4px; color: var(--dark); }

/* 观众席 - emoji 人脸网格 */
.audience-grid {
  display: grid; grid-template-columns: repeat(6,1fr); gap: 2px;
  padding: 6px; background: white; border: 2px solid var(--dark);
}
.audience-cell {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 24px; border: 1.5px solid var(--dark);
  background: #f8f8f8; cursor: pointer;
  transition: transform .15s; position: relative;
}
.audience-cell.pro-bg { background: #E3F2FD; }
.audience-cell.con-bg { background: #FFEBEE; }
.audience-cell:hover { transform: scale(1.4); z-index: 10; border-color: var(--yellow); }
.audience-tip {
  display: none; position: absolute; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--dark); color: white; font-size: 9px; font-weight: 900;
  padding: 2px 6px; white-space: nowrap; border: 2px solid var(--yellow);
  z-index: 20; pointer-events: none;
}
.audience-cell:hover .audience-tip { display: block; }
.audience-summary {
  font-size: 10px; font-weight: 700; color: #666;
  text-align: center; margin-top: 4px;
}

/* 跑票卡片 */
.sway-card {
  background: white; border-left: 4px solid var(--yellow);
  border-top: 3px solid var(--dark); border-right: 3px solid var(--dark);
  border-bottom: 3px solid var(--dark);
  padding: 8px 12px; margin: 6px 0; font-size: 13px; line-height: 1.5;
  font-weight: 700; animation: fadeIn .3s ease;
}
.sway-card .s-label { color: var(--dark); font-weight: 900; }
.sway-card .s-dir { color: #666; font-size: 12px; }

/* 结果框 */
.result-box {
  border: 4px solid var(--dark); background: white;
  box-shadow: 6px 6px 0 var(--dark); padding: 0; text-align: center; overflow: hidden;
}
.result-box.hidden { display: none; }
.result-title {
  border-bottom: 3px solid var(--yellow);
  background: var(--dark); color: white; font-weight: 900;
  padding: 8px; font-size: 14px; letter-spacing: 2px;
}
.result-score { font-size: 56px; font-weight: 900; line-height: 1; margin: 20px 0 16px; text-shadow: 3px 3px 0 rgba(0,0,0,0.15); }
.result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 16px 16px; }

/* 侧边栏卡片 */
.side-card { border: 4px solid var(--dark); background: var(--cream); box-shadow: 4px 4px 0 var(--dark); }
.side-card-header {
  background: var(--dark); color: white; font-weight: 900;
  text-align: center; padding: 7px; font-size: 13px; letter-spacing: 2px;
  border-bottom: 3px solid var(--yellow);
}
.side-body { padding: 8px; }

/* 实时投票初始化标签 */
.live-vote-init { font-size: 10px; color: #666; font-weight: 700; text-align: center; margin-bottom: 4px; }

/* ===== 选择扮演方面板 ===== */
.side-select-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 50;
  display: none; align-items: center; justify-content: center;
}
.side-select-overlay.show { display: flex; }
.side-select-panel {
  background: var(--cream);
  border: 4px solid var(--dark);
  box-shadow: 10px 10px 0 var(--dark);
  padding: 30px 40px;
  max-width: 500px;
  text-align: center;
  animation: fadeIn .3s ease;
}
.side-select-panel h3 {
  font-size: 22px; font-weight: 900;
  margin-bottom: 8px; color: var(--dark);
}
.side-select-panel p {
  font-size: 14px; font-weight: 700;
  color: #666; margin-bottom: 20px;
}
.side-select-btn {
  display: block; width: 100%;
  padding: 14px; margin-bottom: 10px;
  font-size: 16px; font-weight: 900;
  border: 4px solid var(--dark);
  box-shadow: 4px 4px 0 var(--dark);
  cursor: pointer; transition: all 0.1s;
  background: white; color: var(--dark);
}
.side-select-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--dark); }
.side-select-btn:active { transform: translate(3px,3px); box-shadow: none; }
.side-select-btn.pro { border-color: var(--blue); background: #E3F2FD; color: var(--blue); }
.side-select-btn.con { border-color: var(--red); background: #FFEBEE; color: var(--red); }
.side-select-btn.skip { border-color: #999; background: #f0f0f0; color: #666; }

/* ===== 策略选择面板 ===== */
.strategy-select-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 50;
  display: none; align-items: center; justify-content: center;
}
.strategy-select-overlay.show { display: flex; }
.strategy-select-panel {
  background: var(--cream);
  border: 4px solid var(--dark);
  box-shadow: 10px 10px 0 var(--dark);
  padding: 24px 32px;
  max-width: 460px;
  text-align: center;
  animation: fadeIn .3s ease;
}
.strategy-select-panel h3 {
  font-size: 20px; font-weight: 900;
  margin-bottom: 6px; color: var(--dark);
}
.strategy-select-panel .strategy-hint {
  font-size: 13px; font-weight: 700;
  color: #666; margin-bottom: 4px;
}
.strategy-countdown {
  font-size: 14px; font-weight: 900;
  color: var(--red); margin-bottom: 14px;
}
.strategy-btn {
  display: block; width: 100%;
  padding: 12px 14px; margin-bottom: 8px;
  font-size: 14px; font-weight: 900; text-align: left;
  border: 3px solid var(--dark);
  box-shadow: 3px 3px 0 var(--dark);
  cursor: pointer; transition: all 0.1s;
  background: white; color: var(--dark);
}
.strategy-btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--dark); }
.strategy-btn:active { transform: translate(2px,2px); box-shadow: none; }
.strategy-btn .strategy-desc {
  font-size: 11px; font-weight: 700;
  color: #888; display: block; margin-top: 2px;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

</style>
</head>
<body class="brick-wall">

<!-- 装饰齿轮 -->
<div class="gear">⚙️</div>
<div class="gear">⚙️</div>
<div class="gear">⚙️</div>
<div class="gear">⚙️</div>

<!-- 标题 -->
<div class="header">
  <div class="logo">AI CAN BB<span class="logo-reg">®</span></div>
  <div class="tag-ai-summer">AI奇葩说</div>
</div>

<!-- 控制栏 -->
<div class="ctrl-bar" id="ctrlBar">
  <button class="ctrl-btn" id="btnPause" onclick="togglePause()">⏸️ 暂停</button>
  <button class="ctrl-btn" id="btnSkip" onclick="skipStep()">⏭️ 跳过</button>
  <span class="ctrl-progress" id="flowProgress"></span>

<div class="toast" id="toast"></div>
<script>
// ==================== 数据加载 ====================
let DEBATERS=[],TOPICS=[],HOST=null,MENTORS=null,AUDIENCE=[],BATTLE_STRATEGIES=[];
async function loadData(){
  try{
    const [d,t,h,m,a,bs]=await Promise.all([
      fetch('data/debaters.json').then(r=>r.json()),
      fetch('data/topics.json').then(r=>r.json()),
      fetch('data/referee.json').then(r=>r.json()),
      fetch('data/mentors.json').then(r=>r.json()),
      fetch('data/audience_300.json').then(r=>r.json()).catch(()=>fetch('data/audience.json').then(r=>r.json())),
      fetch('data/battle_strategies.json').then(r=>r.json()).catch(()=>[])
    ]);
    DEBATERS=d;TOPICS=t;HOST=Array.isArray(h)?h[0]:h;MENTORS=m;AUDIENCE=a;BATTLE_STRATEGIES=bs;
    populateSelects();
  }catch(e){
    DEBATERS=[
      {id:'chenming',name:'陈铭',label:'逻辑型'},
      {id:'xiaoxiao',name:'肖骁',label:'综艺型'},
      {id:'zhanqingyun',name:'詹青云',label:'理性型'},
      {id:'fushouer',name:'傅首尔',label:'金句型'},
      {id:'huangzhizhong',name:'黄执中',label:'煽情型'},
      {id:'lidan',name:'李诞',label:'解构型'},
      {id:'yanrujing',name:'颜如晶',label:'吃货型'},
      {id:'maweiwei',name:'马薇薇',label:'犀利型'},
      {id:'qiuchen',name:'邱晨',label:'严密型'},
      {id:'jiangsida',name:'姜思达',label:'先锋型'},
      {id:'xirui',name:'席瑞',label:'共情型'},
      {id:'fantiantian',name:'范湉湉',label:'泼辣型'}
    ];
    TOPICS=[{title:'结婚到底要不要买房？'},{title:'该不该告诉孩子家里不富裕？'},{title:'小学生该不该有手机？'}];
    HOST={name:'马东风格',style:'幽默控场'};
    MENTORS=[{name:'薛兆丰',title:'经济学视角'},{name:'蔡康永',title:'温柔视角'}];
    AUDIENCE=Array.from({length:30},(_,i)=>({
      id:i+1,label:['职场妈妈','程序员','大学生','退休大爷','创业者'][i%5],
      emotion:{humor:.5,logic:.5,emotion:.5,story:.5,golden:.5,aggression:.3,novelty:.5}
    }));
    BATTLE_STRATEGIES=[];
    populateSelects();
    toast('数据加载失败，使用内置数据');
  }
}

function populateSelects(){
  const topicEl=document.getElementById('topicSelect');
  topicEl.innerHTML='<option value="">-- 选择辩题 --</option>';
  TOPICS.forEach((t,i)=>{topicEl.innerHTML+=`<option value="${i}">${t.title}</option>`});

  const opts=DEBATERS.map((d,i)=>`<option value="${i}">${d.name}</option>`).join('');
  const ids=['pro1','pro2','pro3','con1','con2','con3'];
  ids.forEach(id=>{document.getElementById(id).innerHTML=opts});

  // 随机分配辩手：打乱索引，前3给正方，后3给反方
  const indices=DEBATERS.map((_,i)=>i);
  for(let i=indices.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indices[i],indices[j]]=[indices[j],indices[i]];
  }
  ids.forEach((id,i)=>{document.getElementById(id).selectedIndex=indices[i]});

  document.getElementById('hostSelect').innerHTML=HOST?`<option value="0">${HOST.name}</option>`:'';

  // 固定显示全部4位导师，不再使用下拉框
  const mentorFixedList=document.getElementById('mentorFixedList');
  if(mentorFixedList&&MENTORS){
    mentorFixedList.innerHTML=MENTORS.map(m=>{
      const emoji=m.title&&(m.title.includes('经济')||m.title.includes('哲学'))?'🧑‍🏫':m.title&&m.title.includes('人文')?'🎩':'🤡';
      return `<span>${emoji} ${m.name.replace('风格','')}</span>`;
    }).join('');
  }
}

// ==================== 情绪引擎 ====================
const EMOJI_MAP=['😂','🤔','😤','👏','😐','😠','🤯','😲','💪','🥱'];
const EMOTION_KEYS=['humor','logic','emotion','golden','story','aggression','novelty','exclamation','short','sublime'];
const EMOJI_NAMES=['幽默','逻辑','感动','金句','故事','攻击','新颖','惊讶','短促','升华'];
const EMOJI_COLORS=['c0','c1','c2','c3','c4','c5','c6','c7','c8','c4'];
let audienceEmotions=[];

function initEmotionEngine(){
  audienceEmotions=AUDIENCE.map(a=>({
    id:a.id,label:a.label,
    dominantIdx:2
  }));
  updateEmotionPanel();
}

/**
 * 从后端state同步观众数据：
 * 把AUDIENCE（300人池）过滤成本场选中的30人
 */
function syncAudienceFromState(stateData){
  const selectedIds=new Set((stateData.audience||[]).map(v=>v.id));
  AUDIENCE=AUDIENCE.filter(a=>selectedIds.has(a.id));
  console.log(`[观众同步] 过滤到 ${AUDIENCE.length} 人`);
}

/**
 * 调 /state 接口后同步观众
 */
async function syncAudienceToSession(sessionId){
  try{
    const res=await fetch(`/api/session/${sessionId}/state`);
    const json=await res.json();
    if(json.code===200&&json.data){
      syncAudienceFromState(json.data);
    }
  }catch(e){
    console.warn('[观众同步] 失败:', e.message);
  }
}

function analyzeText(text){
  if(!text)return EMOTION_KEYS.reduce((o,k)=>({...o,[k]:0}),{});
  const len=Math.max(text.length,1);
  const features={
    humor: (text.match(/[！？~哎呀天哪哈哈笑死滑稽调侃]/g)||[]).length/len*20,
    logic: (text.match(/[因所如果但是不是证明因为所以逻辑分析定义本质]/g)||[]).length/len*15,
    emotion: (text.match(/[爱恨痛哭感动心疼温暖难受愤怒幸福悲伤]/g)||[]).length/len*20,
    golden: (text.match(/[不是...而是人生意义价值最重要]/g)||[]).length/len*15,
    story: (text.match(/[我有个人曾经那时候记得]/g)||[]).length/len*20,
    aggression: (text.match(/[不我不能错反对你凭什么滚吵赢打]/g)||[]).length/len*15,
    novelty: (text.match(/[？如果换个角度重新思考颠覆打破常规]/g)||[]).length/len*15,
    exclamation: (text.match(/[！!?？]/g)||[]).length/len*10,
    short: text.split(/[。！？]/).filter(s=>s.length<8).length/len*20,
    sublime: (text.match(/[命真意义价值灵魂人性世界生命爱自由]/g)||[]).length/len*18
  };
  Object.keys(features).forEach(k=>{features[k]=Math.min(features[k],1)});
  return features;
}

function computeReactions(textFeatures){
  audienceEmotions.forEach(ae=>{
    const a=AUDIENCE.find(x=>x.id===ae.id)||AUDIENCE[0];
    if(!a)return;
    const scores=EMOTION_KEYS.map((key,i)=>{
      const sensitivity=(a.emotion&&a.emotion[key])||(key==='aggression'?0.2:0.4);
      const detected=textFeatures[key]||0;
      return sensitivity*detected*(0.85+Math.random()*0.3);
    });
    const triggers=a.triggers||{};
    const triggerBonus=Object.keys(triggers).reduce((sum,word)=>{
      return sum+(textFeatures.humor>0&&triggers[word]>0?triggers[word]*0.1:0);
    },0);
    let maxIdx=9, maxVal=0;
    scores.forEach((s,i)=>{
      const bonus=i===0?triggerBonus:0;
      if(s+bonus>maxVal){maxVal=s+bonus;maxIdx=i}
    });
    ae.dominantIdx=maxVal<0.1?9:maxIdx;
    ae.triggerActive=triggerBonus>0.1;
  });
}

function updateEmotionPanel(){
  const panel=document.getElementById('auditorium');
  if(!panel)return;
  const totalPro=voteHistory.length>0?voteHistory[voteHistory.length-1].pro:15;
  const totalCon=voteHistory.length>0?voteHistory[voteHistory.length-1].con:15;
  panel.innerHTML=audienceEmotions.map((ae,i)=>{
    const a=AUDIENCE.find(x=>x.id===ae.id);
    const label=a?a.label:'观众';
    const emoji=EMOJI_MAP[ae.dominantIdx]||'😐';
    const ename=EMOJI_NAMES[ae.dominantIdx]||'平静';
    const isPro=Math.random()<(totalPro/(totalPro+totalCon));
    return `<div class="audience-cell ${isPro?'pro-bg':'con-bg'}">
      ${emoji}
      <span class="audience-tip">${label} ${ename}</span>
    </div>`;
  }).join('');
  const summary=document.getElementById('audienceSummary');
  if(summary){
    const counts=Array(10).fill(0);
    audienceEmotions.forEach(ae=>counts[ae.dominantIdx]++);
    const txt=EMOJI_MAP.map((e,i)=>counts[i]>0?`${e}${counts[i]}`:'').filter(Boolean).join(' ');
    summary.textContent=txt||'😐30';
  }
}

// ==================== 跑票追踪 ====================
let voteHistory=[];
function initRunoff(proVotes){
  voteHistory=[{pro:proVotes,con:30-proVotes}];
  updateVoteTugOfWar();
}
function addRunoffPoint(proVotes){
  voteHistory.push({pro:proVotes,con:30-proVotes});
  updateVoteTugOfWar();
}

// ==================== 实时投票拉锯条 ====================
let initialVoteDisplay=null;
function updateVoteTugOfWar(){
  const panel=document.getElementById('votePanel');
  if(!panel)return;
  const len=voteHistory.length;
  if(len===0){panel.style.display='none';return}
  panel.style.display='block';
  const last=voteHistory[len-1];
  const pro=last.pro,con=last.con,total=pro+con;
  const proPct=Math.round(pro/total*100);
  const init=initialVoteDisplay||last;
  document.getElementById('voteInitLabel').textContent='INITIAL '+init.pro+':'+init.con;
  document.getElementById('sideProBar').style.width=proPct+'%';
  document.getElementById('sideConBar').style.width=(100-proPct)+'%';
  document.getElementById('sideProNum').textContent=pro;
  document.getElementById('sideConNum').textContent=con;
  const change=pro-init.pro;
  if(change!==0){
    document.getElementById('voteLeftDiff').textContent=change>0?'+'+change:''+change;
    document.getElementById('voteRightDiff').textContent=change>0?'-'+change:'+'+Math.abs(change);
  }else{
    document.getElementById('voteLeftDiff').textContent='';
    document.getElementById('voteRightDiff').textContent='持平';
  }
}
function setInitialVote(pro,con){
  initialVoteDisplay={pro,con};
  updateVoteTugOfWar();
}

// ==================== 选择扮演方 ====================
let pendingSideSelect=null; // { battlePhase, resolve }

function showSideSelectPanel(battlePhase){
  return new Promise(resolve=>{
    const overlay=document.getElementById('sideSelectOverlay');
    const hint=document.getElementById('sideSelectHint');
    hint.textContent=battlePhase==='p1'?'你想在一辩开杠中扮演哪一方？':'你想在三辩开杠中扮演哪一方？';
    overlay.classList.add('show');
    pendingSideSelect={battlePhase, resolve};
  });
}

function selectSide(side){
  const overlay=document.getElementById('sideSelectOverlay');
  overlay.classList.remove('show');
  if(pendingSideSelect){
    const {battlePhase, resolve}=pendingSideSelect;
    pendingSideSelect=null;

    const sideValue=side==='skip'?null:side;
    // 发送到后端
    if(sessionId&&!useMock){
      fetch(`/api/session/${sessionId}/battle/select-side`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({battlePhase, side: sideValue})
      }).catch(e=>console.error('[API] select-side失败:', e.message));
    }
    resolve(sideValue);
  }
}

// ==================== 策略选择 ====================
let pendingStrategySelect=null; // { battlePhase, turn, resolve }
let strategyTimer=null;
let currentStrategyList=[]; // 当前显示的策略列表（用于超时自动选择）

// 14个策略对应的emoji
const STRATEGY_EMOJI_MAP={
  'confront':'⚔️','critique':'🔍','counterforce':'🔄','follow-through':'♟️',
  'undermine':'💥','contradiction':'⚡','strike-core':'🎯','clarify':'📖',
  'lure':'🪤','substitute':'🔄','avoid':'↩️','humor':'😄',
  'emotional':'💖','sublime':'🌟'
};

function getStrategyEmoji(strategyId){
  return STRATEGY_EMOJI_MAP[strategyId]||'🎯';
}

async function loadRecommendedStrategies(battlePhase, turn){
  // 如果不是API模式，跳过
  if(!sessionId||useMock)return null;
  try{
    const res=await fetch(`/api/session/${sessionId}/battle/recommend-strategies?phase=${battlePhase}&turn=${turn}`);
    const json=await res.json();
    if(json.code===200&&json.data&&json.data.strategies&&json.data.strategies.length>0){
      console.log('[策略] 获取推荐成功:', json.data.strategies.length, '个策略');
      return json.data.strategies;
    }
  }catch(e){
    console.warn('[策略] 推荐API失败:', e.message);
  }
  return null;
}

async function showStrategySelectPanel(battlePhase, turn, debaterName){
  const overlay=document.getElementById('strategySelectOverlay');
  const hint=document.getElementById('strategyHint');
  const countdown=document.getElementById('strategyCountdown');
  const btnContainer=document.getElementById('strategyButtons');

  const phaseLabel=battlePhase==='p1'?'一辩开杠':'三辩开杠';
  hint.textContent=`${phaseLabel} · 第${turn}轮 · ${debaterName||'未知辩手'} 请选择策略`;

  // 1. 尝试从API加载推荐策略
  let strategies=await loadRecommendedStrategies(battlePhase, turn);

  // 2. 降级：使用本地策略库
  if(!strategies||strategies.length===0){
    if(BATTLE_STRATEGIES.length===0){
      resolveToNull();
      return;
    }
    // 本地fallback：用前5个或全部
    strategies=BATTLE_STRATEGIES.slice(0,5).map(s=>({
      id:s.id, name:s.name, description:s.description,
      effect:s.effect||'', reason:s.description
    }));
  }

  // 保存当前策略列表，用于超时自动选择
  currentStrategyList=strategies;

  // 3. 生成策略按钮（显示推荐理由作为副标题）
  btnContainer.innerHTML=strategies.map(s=>
    `<button class="strategy-btn" onclick="selectStrategy('${s.id}')">
      ${getStrategyEmoji(s.id)} ${s.name}
      <span class="strategy-desc">${s.reason||s.description}</span>
    </button>`
  ).join('');

  // 4. 显示面板 + 倒计时
  return new Promise(resolve=>{
    overlay.classList.add('show');
    pendingStrategySelect={battlePhase, turn, resolve};

    let seconds=10;
    countdown.textContent=`剩余时间: ${seconds}s`;
    if(strategyTimer)clearInterval(strategyTimer);
    strategyTimer=setInterval(()=>{
      seconds--;
      countdown.textContent=`剩余时间: ${seconds}s`;
      if(seconds<=0){
        clearInterval(strategyTimer);
        strategyTimer=null;
        autoSelectStrategy();
      }
    },1000);
  });
}

function resolveToNull(){
  if(pendingStrategySelect){
    const {resolve}=pendingStrategySelect;
    pendingStrategySelect=null;
    resolve(null);
  }
}

function selectStrategy(strategyId){
  if(strategyTimer){
    clearInterval(strategyTimer);
    strategyTimer=null;
  }
  const overlay=document.getElementById('strategySelectOverlay');
  overlay.classList.remove('show');
  if(pendingStrategySelect){
    const {battlePhase, turn, resolve}=pendingStrategySelect;
    pendingStrategySelect=null;
    // 发送到后端
    if(sessionId&&!useMock){
      fetch(`/api/session/${sessionId}/battle/strategy`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({battlePhase, turn, strategyId})
      }).catch(e=>console.error('[API] strategy失败:', e.message));
    }
    resolve(strategyId);
  }
}

function autoSelectStrategy(){
  const overlay=document.getElementById('strategySelectOverlay');
  overlay.classList.remove('show');
  if(pendingStrategySelect){
    const {battlePhase, turn, resolve}=pendingStrategySelect;
    pendingStrategySelect=null;
    // 从当前显示的策略列表中随机选（兼容API推荐和本地fallback）
    if(currentStrategyList.length>0){
      const randomIdx=Math.floor(Math.random()*currentStrategyList.length);
      const strategyId=currentStrategyList[randomIdx].id;
      if(sessionId&&!useMock){
        fetch(`/api/session/${sessionId}/battle/strategy`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({battlePhase, turn, strategyId})
        }).catch(e=>console.error('[API] strategy失败:', e.message));
      }
      toast(`⏰ 超时自动选择: ${currentStrategyList[randomIdx].name}`);
      resolve(strategyId);
    }else{
      resolve(null);
    }
  }
}

// URL 带 ?z 才开启语音（省钱模式）
const hasVoiceParam = window.location.search.includes('z');

let currentAudio=null;
let audioLoadQueue=[];

function toggleVoice(){
  voiceEnabled=!voiceEnabled;
  document.getElementById('btnVoice').textContent=voiceEnabled?'🔊 语音':'🔇 静音';
  if(!voiceEnabled&&currentAudio){
    currentAudio.pause();
    currentAudio=null;
  }
}

function playAudio(audioUrl){
  if(!voiceEnabled||!audioUrl)return Promise.resolve();
  if(currentAudio){
    currentAudio.pause();
    currentAudio=null;
  }
  return new Promise(resolve=>{
    const audio=new Audio(audioUrl);
    currentAudio=audio;
    audio.onended=()=>{currentAudio=null;resolve()};
    audio.onerror=()=>{currentAudio=null;resolve()};
    audio.play().catch(()=>{currentAudio=null;resolve()});
  });
}

function pauseAudio(){
  if(currentAudio&&!currentAudio.paused)currentAudio.pause();
}

function resumeAudio(){
  if(currentAudio&&currentAudio.paused)currentAudio.play().catch(()=>{});
}

function stopAudio(){
  if(currentAudio){
    currentAudio.pause();
    currentAudio=null;
  }
}

// ==================== 渲染函数 ====================
function scrollToBottom(){
  const stage=document.getElementById('stage');
  if(stage)stage.scrollTop=stage.scrollHeight;
}
function removeLoadingIndicator(){
  const el=document.getElementById('loadingIndicator');
  if(el)el.remove();
}
function typeWrite(el,text,speed=50){
  return new Promise(resolve=>{
    el.innerHTML='';
    typewriterState={el,text,i:0,speed,timer:null,resolve};
    advanceTypewriter();
    el.classList.add('typing-cursor');
  });
}

function advanceTypewriter(){
  const s=typewriterState;
  if(s.timer)clearInterval(s.timer);
  if(s.i>=s.text.length){
    s.el.classList.remove('typing-cursor');
    if(s.resolve)s.resolve();
    return;
  }
  s.timer=setInterval(()=>{
    if(paused)return;
    if(s.i>=s.text.length){
      clearInterval(s.timer);
      s.el.classList.remove('typing-cursor');
      if(s.resolve)s.resolve();
      return;
    }
    s.el.textContent+=s.text[s.i];
    s.i++;
    scrollToBottom();
  },s.speed);
}

function pauseTypewriter(){
  if(typewriterState.timer)clearInterval(typewriterState.timer);
}
function resumeTypewriter(){
  if(typewriterState.i<typewriterState.text.length)advanceTypewriter();
  else if(typewriterState.resolve)typewriterState.resolve();
}

// 导师插话头像映射
const MENTOR_EMOJI={'薛兆丰':'🧑‍🏫','蔡康永':'🎩','李诞':'🤡','刘擎':'🧑‍🏫','马东':'🎙️'};

function renderStep(step){
  const container=document.getElementById('debateContent');
  removeLoadingIndicator();
  const empty=container.querySelector('.stage-empty');
  if(empty)empty.remove();

  switch(step.type){
    case 'host':{
      const div=document.createElement('div');
      div.className='speech-moderator';
      container.appendChild(div);
      const feats=analyzeText(step.text);
      computeReactions(feats);
      updateEmotionPanel();
      playAudio(step.audioUrl);
      return typeWrite(div,step.text).then(()=>{
        scrollToBottom();
      });
    }
    case 'speech':
    case 'closing':{
      const div=document.createElement('div');
      const side=step.side;
      div.className=`speech-bubble bubble-${side}`;
      const labelText=step.name;
      const sideLabel=side==='pro'?'正方':'反方';
      div.innerHTML=`<div class="bubble-speaker">${sideLabel} · ${labelText}</div><div class="typing-area"></span>`;
      container.appendChild(div);
      scrollToBottom();
      const textSpan=div.querySelector('.typing-area');
      const feats=analyzeText(step.text);
      computeReactions(feats);
      updateEmotionPanel();
      if(voteHistory.length>0){
        const last=voteHistory[voteHistory.length-1].pro;
        const drift=Math.random()>0.5?1:-1;
        const newPro=Math.max(0,Math.min(30,last+drift));
        addRunoffPoint(newPro);
      }
      playAudio(step.audioUrl);
      return typeWrite(textSpan,step.text).then(()=>{
        scrollToBottom();
      });
    }
    case 'battle':{
      const phase=step.phase||'p1';
      const phaseClass=phase==='p1'?'p1-battle':'p3-battle';
      let battleRow=container.querySelector(`.cross-row-${phase}-${step.round}`);
      if(!battleRow){
        battleRow=document.createElement('div');
        battleRow.className=`cross-exam-box ${phaseClass} cross-row-${phase}-${step.round}`;
        const label=document.createElement('div');
        label.className='cross-round';
        label.textContent=`⚡ Round ${step.round}/3`;
        battleRow.appendChild(label);
        const left=document.createElement('div');
        left.className='cross-col';
        const right=document.createElement('div');
        right.className='cross-col';
        left.innerHTML='<div class="cross-side">正方</div><div class="cross-name"></div><div class="cross-text"></div>';
        right.innerHTML='<div class="cross-side">反方</div><div class="cross-name"></div><div class="cross-text"></div>';
        battleRow.appendChild(left);
        battleRow.appendChild(right);
        container.appendChild(battleRow);
      }
      const sides=battleRow.querySelectorAll('.cross-col');
      const idx=step.side==='pro'?0:1;
      sides[idx].querySelector('.cross-name').textContent='⚡ '+step.name;
      const textEl=sides[idx].querySelector('.cross-text');
      textEl.textContent=step.text;
      // 如果有策略标签
      if(step.strategyName){
        const tag=document.createElement('span');
        tag.className='cross-strategy-tag';
        tag.textContent=step.strategyName;
        sides[idx].querySelector('.cross-name').appendChild(tag);
      }
      sides[idx].classList.add('pro');
      scrollToBottom();
      const feats=analyzeText(step.text);
      computeReactions(feats);
      updateEmotionPanel();
      if(voteHistory.length>0){
        const last=voteHistory[voteHistory.length-1].pro;
        const drift=Math.floor(Math.random()*3)-1;
        const newPro=Math.max(0,Math.min(30,last+drift));
        addRunoffPoint(newPro);
      }
      playAudio(step.audioUrl);
      return Promise.resolve();
    }
    case 'vote':{
      const box=document.createElement('div');
      box.className='vote-box';
      const pctPro=Math.round(step.pro/30*100);
      const hasInitVote=lastInitialVoteData!==null;
      const initPro=hasInitVote?lastInitialVoteData.pro:0;
      const initCon=hasInitVote?lastInitialVoteData.con:0;
      const changePro=step.stage==='final'?step.pro-initPro:0;

      let title='📊 赛前投票';
      if(step.stage==='final'&&hasInitVote){
        title=`📊 最终投票  |  初投 ${initPro}:${initCon}  →  终投 ${step.pro}:${step.con}`;
      }else if(step.stage==='final'){
        title='📊 最终投票';
      }

      box.innerHTML=`
        <div class="vote-title">${title}</div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:14px;font-weight:900;color:var(--blue);min-width:28px">正</span>
          <div style="flex:1;height:28px;background:#eee;border:2px solid var(--dark);overflow:hidden;display:flex">
            <div style="background:var(--blue);width:${pctPro}%;transition:width .8s;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:12px">${step.pro}</div>
            <div style="background:var(--red);width:${100-pctPro}%;transition:width .8s;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:12px">${step.con}</div>
          </div>
          <span style="font-size:14px;font-weight:900;color:var(--red);min-width:28px;text-align:right">反</span>
        </div>
        ${changePro!==0?`<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:900;padding:0 34px;margin-top:4px">
          <span style="color:${changePro>0?'#00C7B7':'var(--red)'}">${changePro>0?'+'+changePro:changePro}</span>
          <span style="color:${changePro>0?'var(--red)':'#00C7B7'}">${changePro>0?'-'+changePro:'+'+Math.abs(changePro)}</span>
        </div>`:''}`;
      container.appendChild(box);
      scrollToBottom();
      if(step.stage==='initial'){
        lastInitialVoteData={pro:step.pro,con:step.con};
        setInitialVote(step.pro,step.con);
        initRunoff(step.pro);
      }else{
        addRunoffPoint(step.pro);
      }
      const allSways=step.sways||[];
      if(step.stage==='initial'&&step.details&&step.details.length){
        lastInitialVote=step.details;
      }
      if(step.stage==='final'&&step.details&&step.details.length&&lastInitialVote){
        const initMap={};
        lastInitialVote.forEach(d=>{initMap[d.viewerId]=d.choice});
        step.details.forEach(d=>{
          if(initMap[d.viewerId]&&initMap[d.viewerId]!==d.choice){
            allSways.push({
              who:`观众 #${d.viewerId}（${d.label||''}）`,
              from:initMap[d.viewerId]==='pro'?'正方':'反方',
              to:d.choice==='pro'?'正方':'反方',
              reason:d.reason||'（理由未提供）'
            });
          }
        });
      }
      if(allSways.length){
        setTimeout(()=>{
          const winnerSide=step.pro>step.con?'正方':'反方';
          const diff=Math.abs(step.pro-step.con);
          const winner=document.createElement('div');
          winner.style.cssText='text-align:center;color:var(--gold);font-size:14px;font-weight:600;margin:8px 0';
          winner.textContent=`🏆 ${winnerSide}获胜（${diff}票优势）！跑票${allSways.length}人`;
          container.appendChild(winner);
          allSways.slice(0,8).forEach(s=>{
            const card=document.createElement('div');
            card.className='sway-card';
            card.innerHTML=`<span class="s-label">${s.who}</span>
              <span class="s-dir">${s.from} → ${s.to}</span><br>“${s.reason}”`;
            container.appendChild(card);
            scrollToBottom();
          });
        },600);
      }
      return new Promise(r=>setTimeout(r,800));
    }
    case 'mentor_comment':{
      const box=document.createElement('div');
      box.className='mentor-comment-box';
      const icon=MENTOR_EMOJI[step.name]||'🎙️';
      const stanceLabel=step.stance==='pro'?'🔵正方':step.stance==='con'?'🔴反方':'';
      box.innerHTML=`
        <div class="mentor-comment-header">
          <div class="mentor-comment-avatar">${icon}</div>
          <div class="mentor-comment-name">${step.name}</div>
          <div class="mentor-comment-tag">💬 插话${stanceLabel?' · '+stanceLabel:''}</div>
        </div>
        <div class="mentor-comment-text typing-area"></div>`;
      container.appendChild(box);
      scrollToBottom();
      const textEl=box.querySelector('.typing-area');
      return typeWrite(textEl,step.text).then(()=>{
        scrollToBottom();
      });
    }
    case 'mentor':{
      const eMap={'薛兆丰':'🧑‍🏫','蔡康永':'🎩','李诞':'🤡','刘擎':'🧑‍🏫','马东':'🎙️'};
      const icon=Object.keys(eMap).find(k=>step.name.includes(k));
      document.getElementById('mentorBox').classList.remove('hidden');
      document.getElementById('mentorAvatar').textContent=icon?eMap[icon]:'🎙️';
      const stanceLabel=step.stance==='pro'?' 🔵正方':step.stance==='con'?' 🔴反方':'';
      document.getElementById('mentorName').textContent=step.name+stanceLabel;
      const textEl=document.getElementById('mentorText');
      textEl.classList.add('typing-cursor');
      playAudio(step.audioUrl);
      return typeWrite(textEl,step.text).then(()=>{textEl.classList.remove('typing-cursor');scrollToBottom();});
    }
    case 'done':{
      document.getElementById('statusBar').classList.remove('show');
      document.getElementById('btnPause').style.display='none';
      document.getElementById('btnSkip').style.display='none';
      document.getElementById('resultBox').classList.remove('hidden');
      const lastVote=voteHistory.length>0?voteHistory[voteHistory.length-1]:{pro:0,con:0};
      document.getElementById('finalScore').textContent=lastVote.pro+' - '+lastVote.con;
      playRunning=false;
      return Promise.resolve();
    }
  }
  return Promise.resolve();
}

function normalizeAPIStep(data){
  if(data.done) return {type:'done',status:data.status||'SUCCESS'};
  const step={
    type:data.type,
    text:data.content||'',
    name:data.speakerName||'',
    side:data.side,
    stance:data.stance||null,
    audioUrl:data.audioUrl||null,
    flowProgress:data.flowProgress||null,
    degraded:data.degraded||false,
    attemptCount:data.attemptCount||1
  };
  if(data.type==='vote'){
    step.pro=data.pro;step.con=data.con;
    step.abstain=data.abstain||0;
    step.stage=data.label==='init'?'initial':'final';
    step.pro_pct=data.pro_pct;step.con_pct=data.con_pct;
    step.validCount=data.validCount;
    step.details=data.details||[];
  }
  if(data.type==='battle'){
    // 解析 battlePhase 和 battleTurn (step format: battle_p1_pro_1)
    const m=data.step&&data.step.match(/battle_(p[13])_(pro|con)_(\d+)/);
    if(m){
      step.phase=m[1];
      step.round=parseInt(m[3]);
    }else{
      step.phase='p1';
      step.round=1;
    }
    step.pos=data.position||'third';
    // 策略信息
    if(data.strategyName) step.strategyName=data.strategyName;
  }
  if(data.type==='mentor') step.title=data.speakerTitle||'导师点评';
  if(data.type==='mentor_comment') step.title='导师插话';
  return step;
}

// ==================== 开杠交互状态追踪 ====================
let battleInteractionState={
  phase:null,        // 'p1' | 'p3'
  selectedSide:null, // 'pro' | 'con' | null (null=skip)
  currentTurn:0,     // 0-3
  strategies:{},     // { '1': 'strategyId', ... }
  isActive:false,    // 当前是否处于开杠阶段
};

// ==================== 播放循环 ====================
async function playLoop(){
  if(playRunning)return;
  playRunning=true;

  // 重置开杠交互状态
  battleInteractionState={phase:null,selectedSide:null,currentTurn:0,strategies:{},isActive:false};

  while(true){
    if(skipRequested){
      skipRequested=false;
      if(useMock)currentStepIdx++;
      const feats=analyzeText('(跳过)');
      computeReactions(feats);updateEmotionPanel();
      continue;
    }
    if(paused){playRunning=false;return}

    let step,done=false;
    if(useMock){
      if(currentStepIdx>=mockSteps.length)break;
      step=mockSteps[currentStepIdx];
      done=(step.type==='done');

      // 模拟模式：检测到开杠环节即将开始
      if(!done && step.type==='host' && step.text&&step.text.includes('开杠')){
        const phase=(currentStepIdx<15)?'p1':'p3';
        const selectedSide=await showSideSelectPanel(phase);
        battleInteractionState.phase=phase;
        battleInteractionState.selectedSide=selectedSide;
        battleInteractionState.currentTurn=0;
        battleInteractionState.strategies={};
        battleInteractionState.isActive=(selectedSide!==null);
      }

      // 模拟模式：开杠中，为扮演方弹出策略选择
      if(!done && step.type==='battle' && battleInteractionState.isActive && step.side===battleInteractionState.selectedSide){
        battleInteractionState.currentTurn=step.round||1;
        const turn=String(battleInteractionState.currentTurn);
        const strategyId=await showStrategySelectPanel(battleInteractionState.phase, parseInt(turn), step.name);
        if(strategyId){
          battleInteractionState.strategies[turn]=strategyId;
          const s=BATTLE_STRATEGIES.find(x=>x.id===strategyId);
          if(s) step.strategyName=s.name;
        }
      }

    }else{
      try{
        const controller=new AbortController();
        const tid=setTimeout(()=>controller.abort(),120000);
        const res=await fetch(`/api/session/${sessionId}/next`,{signal:controller.signal});
        clearTimeout(tid);
        const json=await res.json();
        console.log('[API] /next 返回:', json.data&&json.data.type, json.data&&json.data.step||'');
        if(json.code!==200||!json.data)throw new Error('API返回异常: code='+json.code);
        const raw=json.data;
        if(raw.done){done=true;step={type:'done',status:raw.status||'SUCCESS'}}
        else step=normalizeAPIStep(raw);

        // API模式：检测到 host_battle 步骤 → 弹出选择扮演方面板
        if(!done && step.type==='host'){
          const stepName=raw.step||'';
          if(stepName==='host_battle_p1'||stepName==='host_battle_p3'){
            const phase=stepName==='host_battle_p1'?'p1':'p3';
            const selectedSide=await showSideSelectPanel(phase);
            await fetch(`/api/session/${sessionId}/battle/select-side`,{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({battlePhase:phase, side:selectedSide})
            }).catch(e=>console.error('[API] select-side失败:', e.message));
            battleInteractionState.phase=phase;
            battleInteractionState.selectedSide=selectedSide;
            battleInteractionState.currentTurn=0;
            battleInteractionState.strategies={};
            battleInteractionState.isActive=(selectedSide!==null);
          }
        }

        // API模式：开杠中，为扮演方预提交下一轮策略
        if(!done && step.type==='battle' && battleInteractionState.isActive && step.side===battleInteractionState.selectedSide){
          battleInteractionState.currentTurn=step.round||1;
          const turn=battleInteractionState.currentTurn;
          if(!battleInteractionState.strategies[String(turn)]){
            const debaterName=step.name||'';
            const strategyId=await showStrategySelectPanel(battleInteractionState.phase, turn, debaterName);
            if(strategyId){
              battleInteractionState.strategies[String(turn)]=strategyId;
              await fetch(`/api/session/${sessionId}/battle/strategy`,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({battlePhase:battleInteractionState.phase, turn:turn, strategyId})
              }).catch(e=>console.error('[API] strategy失败:', e.message));
              const s=BATTLE_STRATEGIES.find(x=>x.id===strategyId);
              if(s) step.strategyName=s.name;
            }
          }
        }

    }catch(e){
      console.error('[API] /next 失败:', e.message);
      setAPIMode(false);
      toast(`API请求中断: ${e.message}，降级到模拟数据`);
      useMock=true;currentStepIdx=0;
      const [proTeam,conTeam,mentors]=getCurrentConfigFromSelects();
      mockSteps=buildMockSteps(
        document.getElementById('topicCustom').value.trim()||'结婚到底要不要买房？',
        proTeam,conTeam,{name:'马东'},mentors
      );
      initEmotionEngine();
      continue;
    }
    }
    // 显示流进度
    if(step.flowProgress){
      document.getElementById('flowProgress').textContent=
        `${step.flowProgress.current}/${step.flowProgress.total}`;
    }
    // degraded 提示
    if(step.degraded)toast(`⚠️ 降级生成（第${step.attemptCount}次尝试）`);

    document.getElementById('statusBar').classList.remove('show');
    await renderStep(step);

    if(done||step.type==='done'){playRunning=false;return}
    const waitTime=step.type==='vote'?1200:step.type==='battle'?1000:800;
    await new Promise(r=>setTimeout(r,waitTime));
    if(useMock&&!skipRequested)currentStepIdx++;
  }
  playRunning=false;
}

// ==================== 辅助函数 ====================
function getCurrentConfigFromSelects(){
  const proTeam=[
    DEBATERS[parseInt(document.getElementById('pro1').value)],
    DEBATERS[parseInt(document.getElementById('pro2').value)],
    DEBATERS[parseInt(document.getElementById('pro3').value)]
  ];
  const conTeam=[
    DEBATERS[parseInt(document.getElementById('con1').value)],
    DEBATERS[parseInt(document.getElementById('con2').value)],
    DEBATERS[parseInt(document.getElementById('con3').value)]
  ];
  // 返回全部4位导师，不再从下拉框读取
  const mentors = MENTORS ? [...MENTORS] : [];
  return [proTeam,conTeam,mentors];
}

function setAPIMode(connected){
  const el=document.getElementById('modeIndicator');
  if(connected){
    el.style.cssText='font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(74,222,128,0.2);color:var(--green);display:inline-block';
    el.textContent='✅ API 已连接';
  }else{
    el.style.cssText='font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(248,113,113,0.2);color:var(--red);display:inline-block';
    el.textContent='⚠️ 模拟数据模式';
  }
}

// ==================== 控制函数 ====================
function togglePause(){
  paused=!paused;
  document.getElementById('btnPause').textContent=paused?'▶️ 继续':'⏸️ 暂停';
  document.getElementById('statusBar').textContent=paused?'⏸️ 已暂停':'⏳ 正在生成...';
  document.getElementById('statusBar').classList.toggle('show',paused);
  if(paused){
    pauseTypewriter();
    pauseAudio();
  }else{
    resumeTypewriter();
    resumeAudio();
    if(!playRunning)playLoop();
  }
}

function skipStep(){
  skipRequested=true;
  pauseTypewriter();
  stopAudio();
  if(paused)togglePause();
  if(!playRunning)playLoop();
}

async function startDebate(){
  const topicEl=document.getElementById('topicSelect');
  const custom=document.getElementById('topicCustom').value.trim();
  const topicIndex=topicEl.value!==''?parseInt(topicEl.value):-1;
  let topic=custom||(topicIndex>=0?TOPICS[topicIndex].title:'');
  if(!topic){toast('请选择或输入一个辩题');return}

  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnStart').textContent='🎙️ 辩论中...';
  document.getElementById('configPanel').classList.add('hidden');
  document.getElementById('mainLayout').classList.remove('hidden');
  document.getElementById('topicBanner').textContent=topic;
  document.getElementById('debateContent').innerHTML='';
  document.getElementById('statusBar').classList.remove('show');
  document.getElementById('btnPause').classList.add('show');
  document.getElementById('btnSkip').classList.add('show');
  if(hasVoiceParam)document.getElementById('btnVoice').classList.add('show');
  document.getElementById('flowProgress').textContent='';
  paused=false;currentStepIdx=0;playRunning=false;skipRequested=false;useMock=true;
  document.getElementById('btnPause').textContent='⏸️ 暂停';

  const proEls=['pro1','pro2','pro3'].map(id=>document.getElementById(id).value);
  const conEls=['con1','con2','con3'].map(id=>document.getElementById(id).value);
  const proActive=proEls.every(v=>v!==''&&DEBATERS[parseInt(v)]);
  const conActive=conEls.every(v=>v!==''&&DEBATERS[parseInt(v)]);
  const [proTeam,conTeam,mentors]=getCurrentConfigFromSelects();

  // 尝试连接后端
  if(proActive&&conActive){
    try{
      document.getElementById('statusBar').classList.add('show');
      document.getElementById('statusBar').textContent='⏳ 连接后端...';
      const body={pro:proEls.map(i=>DEBATERS[parseInt(i)].id),con:conEls.map(i=>DEBATERS[parseInt(i)].id),voiceEnabled:hasVoiceParam};
      if(topicIndex>=0)body.topicIndex=topicIndex;
      if(custom)body.customTopic=custom;
      const res=await fetch('/api/session/start',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      const json=await res.json();
      console.log('[API] /start 返回:', JSON.stringify(json).slice(0,200));
      if(json.code===200&&json.data&&json.data.sessionId){
        sessionId=json.data.sessionId;
        useMock=false;
        localStorage.setItem('lastSessionId',sessionId);
        setAPIMode(true);
        // 同步观众：从300人池中筛选出本场抽中的30人
        await syncAudienceToSession(sessionId);
        toast('后端已连接，正在生成辩论...');
      }else throw new Error('API返回异常: code='+json.code);
    }catch(e){
      console.error('[API] /start 失败:', e.message);
      setAPIMode(false);
      toast(`后端未连接: ${e.message}`);
    }
  }

  if(useMock){
    mockSteps=buildMockSteps(topic,proTeam,conTeam,HOST||{name:'马东'},mentors);
  }
  initEmotionEngine();
  lastInitialVote=null;
  document.getElementById('statusBar').textContent='⏳ 正在生成...';
  const loadingEl=document.createElement('div');
  loadingEl.id='loadingIndicator';
  loadingEl.style.cssText='text-align:center;padding:30px;font-weight:900;font-size:15px;color:#666';
  loadingEl.textContent='⏳ LLM 正在生成辩论内容...';
  document.getElementById('debateContent').appendChild(loadingEl);
  playLoop();
}

function exportScript(){
  const text=document.getElementById('debateContent').innerText;
  const blob=new Blob([text],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`ai-qipashuo-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

// ==================== 初始化 ====================
// 语音按钮：默认隐藏，?z 模式才显示
document.getElementById('btnVoice').style.display = hasVoiceParam ? '' : 'none';
if (hasVoiceParam) {
  document.getElementById('btnVoice').textContent = '🔊 语音';
}
loadData();

// Session 恢复检测
const savedId=localStorage.getItem('lastSessionId');
if(savedId){
  setTimeout(async()=>{
    try{
      const res=await fetch(`/api/session/${savedId}/state`);
      const json=await res.json();
      if(json.code===200&&json.data&&json.data.status==='RUNNING'){
        if(confirm(`检测到未完成的辩论（${json.data.topicTitle||''}），是否恢复？`)){
          sessionId=savedId;useMock=false;
          // 同步观众到本场选中的30人
          syncAudienceFromState(json.data);
          document.getElementById('configPanel').classList.add('hidden');
          document.getElementById('mainLayout').classList.remove('hidden');
          document.getElementById('btnPause').classList.add('show');
          document.getElementById('btnSkip').classList.add('show');
          initEmotionEngine();
          playLoop();
        }
      }
    }catch(e){}
  },500);
}
